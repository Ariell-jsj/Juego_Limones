<!DOCTYPE html>
<html>
<head>
  <title>Cazando Limones</title>
  <link rel="stylesheet" href="limones.css"/>
  <script src="utilis.js"></script>
</head>

<body onload="iniciar()">

  <div class="contenedor">

    <h1>🍋 Atrapar Limones 🍋</h1>

    <p class="subtitulo">
      Si del cielo te caen limones... ¡haz limonada!
    </p>

    <h2>Autor: Ariell</h2>

 <div class="game-layout">

    <div class="card marcador">
        <h3>PUNTAJE</h3>
        <span id="txtPuntaje">0</span>
    </div>

    <div class="centro-juego">

        <canvas id="areaJuego" width="600" height="400"></canvas>

        <div class="botones">

            <button onclick="moverIzquierda();" class="izquierda">
                ⬅
            </button>

            <button onclick="reiniciarJuego();" class="reiniciar">
            ☠
            </button>

            <button onclick="moverDerecha();" class="derecha">
                ➡
            </button>

        </div>

    </div>

    <div class="card marcador">
        <h3>VIDAS</h3>
        <span id="txtVidas">3</span>
    </div>

</div>

  </div>

  <script src="limones.js"></script>

</body>
</html>
